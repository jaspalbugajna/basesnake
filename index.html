<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Snake</title>
    <style>
        body {
            box-sizing: border-box;
            margin: 0;
            padding: 20px;
            background: #0052ff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        h1 {
            margin: 0 0 20px 0;
            font-size: 2.2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .game-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .score {
            background: #0022aa;
            padding: 10px 20px;
            border-radius: 25px;
            border: 1px solid white;
        }

        #gameCanvas {
            border: 4px solid white;
            border-radius: 15px;
            background: #0f172a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .controls {
            margin-top: 20px;
            text-align: center;
            background: #0022aa;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid white;
        }

        .controls p {
            margin: 5px 0;
            font-size: 1rem;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            color: white;
            padding: 30px;
            border-radius: 15px;
            border: 2px solid white;
            text-align: center;
            display: none;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .restart-btn {
            background: white;
            color: #0052ff;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #00d2ff;
            color: white;
        }

        @media (max-width: 600px) {
            #gameCanvas { width: 90vw; height: 60vh; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <h1>🐍 Base Snake</h1>
    
    <div class="game-info">
        <div class="score">Очки: <span id="score">0</span></div>
        <div class="score">Рекорд: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="controls">
        <p>🎮 Управление: стрелки или WASD</p>
        <p>⚡ Собирай блоки сети Base!</p>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Транзакция отменена!</h2>
        <p>Собрано очков: <span id="finalScore">0</span></p>
        <button class="restart-btn" onclick="restartGame()">Повторить</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const gameOverElement = document.getElementById('gameOver');
        const finalScoreElement = document.getElementById('finalScore');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x: 10, y: 10}];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('baseSnakeHighScore') || 0;
        let gameRunning = true;

        highScoreElement.textContent = highScore;

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    generateFood();
                    return;
                }
            }
        }

        function drawGame() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Рисуем змейку (в цветах Base)
            for (let i = 0; i < snake.length; i++) {
                const segment = snake[i];
                ctx.fillStyle = i === 0 ? '#00d2ff' : '#0052ff';
                ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
            }

            // Рисуем еду (крипто-монетку)
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            if (!gameRunning || (dx === 0 && dy === 0)) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            finalScoreElement.textContent = score;
            if (score > highScore) {
                highScore = score;
                highScoreElement.textContent = highScore;
                localStorage.setItem('baseSnakeHighScore', highScore);
            }
            gameOverElement.style.display = 'block';
        }

        function restartGame() {
            snake = [{x: 10, y: 10}];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            gameRunning = true;
            gameOverElement.style.display = 'none';
            generateFood();
        }

        document.addEventListener('keydown', (e) => {
            if (!gameRunning) return;
            const key = e.key.toLowerCase();
            if ((key === 'arrowleft' || key === 'a') && dx !== 1) { dx = -1; dy = 0; }
            else if ((key === 'arrowup' || key === 'w') && dy !== 1) { dx = 0; dy = -1; }
            else if ((key === 'arrowright' || key === 'd') && dx !== -1) { dx = 1; dy = 0; }
            else if ((key === 'arrowdown' || key === 's') && dy !== -1) { dx = 0; dy = 1; }
        });

        function gameLoop() {
            moveSnake();
            drawGame();
        }

        generateFood();
        drawGame();
        setInterval(gameLoop, 150);
    </script>
</body>
</html>
